<!doctype html>
<html lang="en">
<head>

<title>HUX: page not found</title>
<script>
  // An account e-mail link that landed here (Supabase puts #access_token=… or #error=… after the address):
  // finish it on the website's account page instead, keeping the result.
  (function () {
    var h = location.hash || '', q = location.search || '';
    if (/(^|[#&?])(access_token|error|error_code|type|token_hash|code)=/.test(h + q)) {
      location.replace('https://myhux.in/account/' + q + h);
      return;
    }
    // the bare root: go to the HUX website
    // an old website link (kirath25.github.io/hux-website/...): the same page on myhux.in
    var m = /^\/hux-website(\/.*)?$/.exec(location.pathname);
    if (m) { location.replace('https://myhux.in' + (m[1] || '/') + q + h); return; }
    if (location.pathname === '/' || location.pathname === '/index.html') location.replace('https://myhux.in/');
  })();
</script>
